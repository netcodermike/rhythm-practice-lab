<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Practice Lab</title><style>body{background:#142336;color:#f1f4ee;font:17px system-ui;max-width:1100px;margin:30px auto;padding:20px}h1{font-size:42px}button,input,select,textarea{font:inherit;padding:9px;margin:5px;border-radius:5px}button{background:#9fe0bc;cursor:pointer;border:0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #496076;text-align:left}canvas{background:white;max-width:100%;touch-action:none}textarea{width:90%;min-height:110px}#status{min-height:24px}a{color:#9fe0bc}@media print{body{background:white;color:black}button,input,select{display:none}}</style><h1>Rhythm Practice Lab</h1><p>Listen to a metronome, then measure taps against the nearest beat grid.</p><label>BPM <input id="bpm" type="number" min="30" max="240" value="120"></label><button id="start">Start metronome</button><button id="stop">Stop</button><button id="tap">Tap (Space)</button><button id="reset">Reset taps</button><p id="beat">Ready</p><pre id="results"></pre><p id="status" role="status"></p><script type="module">
import{analyze}from'/core.js';const el=id=>document.getElementById(id);let ctx,timer,next=0,count=0,taps=[];const bpm=()=>{const n=+el('bpm').value;if(n<30||n>240||!Number.isFinite(n))throw Error('BPM 30–240 required');return n;};function stop(){clearInterval(timer);if(ctx){ctx.close();ctx=null;}el('bpm').disabled=false;el('beat').textContent='Stopped';}el('start').onclick=async()=>{try{const tempo=bpm();stop();ctx=new AudioContext();await ctx.resume();next=ctx.currentTime+.05;count=0;el('bpm').disabled=true;timer=setInterval(()=>{if(!ctx)return;while(next<ctx.currentTime+.1){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=count%4===0?1000:650;gain.gain.setValueAtTime(.1,next);gain.gain.exponentialRampToValueAtTime(.001,next+.05);osc.connect(gain);gain.connect(ctx.destination);osc.start(next);osc.stop(next+.06);next+=60/tempo;count++;}el('beat').textContent='Beat '+count;},25);}catch(e){el('status').textContent=e.message;}};el('stop').onclick=stop;function tap(){try{bpm();taps.push(performance.now());if(taps.length>64)taps.shift();if(taps.length>1){const r=analyze(taps,bpm());el('results').textContent=`${taps.length} taps · mean absolute ${r.meanAbsolute.toFixed(1)} ms · RMS ${r.rms.toFixed(1)} ms\nSigned errors: ${r.errors.map(x=>x.toFixed(0)).join(', ')} ms`;}}catch(e){el('status').textContent=e.message;}}el('tap').onclick=tap;document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();if(!e.repeat)tap();}});el('reset').onclick=()=>{taps=[];el('results').textContent='';};window.onpagehide=stop;
</script></html>
